# XcodeGen spec. The cloud build turns this into Starhive.xcodeproj.
# To change the app's ID, edit PRODUCT_BUNDLE_IDENTIFIER here AND bundle_identifier in codemagic.yaml.
name: Starhive
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  Starhive:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
      - path: Game
        type: folder
        buildPhase: resources
      - path: Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Starhive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.arcade-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.starhive.defense
        PRODUCT_NAME: Starhive
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
